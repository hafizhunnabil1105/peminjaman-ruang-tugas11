<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Validasi Jadwal</title>
    <style>
      body {
        font-family: Arial;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
        padding: 40px;
      }
      .c {
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        width: 340px;
        box-shadow: 0 2px 10px #0002;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 8px;
        margin: 6px 0;
        box-sizing: border-box;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <h2>Cek Ketersediaan Jadwal</h2>
      <select id="ruang">
        <option>R.4.4-4</option>
        <option>R.4.4-5</option>
        <option>Aula</option>
      </select>
      <input id="tgl" type="date" /><input id="mulai" type="time" /><input
        id="selesai"
        type="time"
      />
      <button onclick="cek()">Cek Jadwal</button>
      <p id="hasil"></p>
    </div>
    <script>
      function cek() {
        const d = JSON.parse(localStorage.getItem("bookings") || "[]");
        const bentrok = d.some(
          (b) =>
            b.ruang === ruang.value &&
            b.tgl === tgl.value &&
            mulai.value < b.selesai &&
            selesai.value > b.mulai,
        );
        hasil.textContent = bentrok
          ? "Jadwal BENTROK: ruang sudah dipinjam"
          : "Jadwal tersedia";
      }
    </script>
  </body>
</html>
